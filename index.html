/* ---------- header ---------- */
.pr-header{

}
.pr-header-inner{

}
.pr-avatar{

}
.pr-avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.pr-heading{flex:1; min-width:240px;}
.pr-heading h1{

}
.pr-heading p{margin:0 0 3px; color:var(--ink-muted); font-size:15px;}

.pr-titleblock{
  flex-shrink:0; min-width:260px;
  border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  font-size:13px;
}
.pr-titleblock-row{display:flex; border-top:1px solid var(--line);}
.pr-titleblock-row:first-child{border-top:none;}
.pr-titleblock-label{
  width:80px; flex-shrink:0; padding:6px 10px; color:var(--ink-muted);
  background:var(--surface); border-right:1px solid var(--line);
}
.pr-titleblock-value{padding:6px 10px; word-break:break-word;}

/* ---------- nav tabs ---------- */
.pr-tabs{
  display:flex; flex-wrap:wrap; gap:0; list-style:none; margin:0; padding:0;
}
.pr-tabs button{
  font-family:inherit; font-size:14.5px; background:transparent; border:none;
  border-bottom:3px solid transparent; cursor:pointer; color:var(--ink-muted);
  padding:14px 18px; transition:color .2s ease, border-color .2s ease, background .2s ease;
}
.pr-tabs button:hover{color:var(--ink); background:var(--surface);}
.pr-tabs button[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent);}

/* ---------- links row ---------- */
.pr-links{
  display:flex; flex-wrap:wrap; gap:8px 18px; padding:14px 0;
  font-size:13px;
}
.pr-links a{text-decoration:none; border-bottom:1px dotted var(--line);}

/* ---------- main content ---------- */
.pr-main{padding:36px 0 80px;}
.pr-main section[data-page]{max-width:100%;}
.pr-main section[hidden]{display:none;}

.pr-main h2{
  font-size:22px; font-weight:700; color:var(--accent); margin:0 0 6px;
}
.pr-h2-rule{height:2px; background:var(--emphasis); width:46px; margin-bottom:24px;}
.pr-main h3{font-size:16px; font-weight:600; color:var(--ink); margin:26px 0 10px;}
.pr-main h3:first-child{margin-top:0;}

.pr-panel{
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--surface-raised); padding:18px 20px; margin-bottom:16px;
}

/* ---------- footer ---------- */
.pr-footer{
  border-top:1px solid var(--line); color:var(--ink-muted);
  text-align:center; padding:22px var(--gutter); font-size:13px;
}

@media (max-width:720px){
  .pr-header-inner{flex-direction:column; align-items:flex-start;}
  .pr-titleblock{width:100%;}
  .pr-tabs{gap:0;}
  .pr-tabs button{padding:12px 14px; font-size:13.5px;}
}

      "Prof. P. Ramkumar joined the Department of Mechanical Engineering at IIT Madras as an Assistant Professor in 2012, was promoted to Associate Professor in 2019, and has been a full Professor since January 2024. Before joining IIT Madras, he was an Associate Professor at SSN College of Engineering, Chennai. He completed his B.E. in Mechanical Engineering at the College of Engineering, Guindy, Anna University, followed by an M.Tech. at IIT Madras. He went on to earn a Ph.D. from the University of Southampton, UK, and completed postdoctoral research at the University of Leicester, UK.",
